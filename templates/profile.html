<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLA | PROFILE</title>
    <style>
        body {
            background-color: #f4f6f9;
            color: #212121;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
        }
        /* Top balance summary cards */
        .summary-card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .summary-box {
            width: 48%;
            text-align: left;
        }
        .summary-box:last-child {
            border-left: 1px solid #f1f3f5;
            padding-left: 15px;
        }
        .summary-lbl {
            color: #8a8a8a;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .summary-val {
            font-size: 20px;
            font-weight: 800;
            color: #111111;
        }
        /* List headers */
        .group-lbl {
            color: #8a8a8a;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin: 25px 0 12px 5px;
        }
        /* Menu grouping blocks */
        .menu-list {
            background-color: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 5px 0;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            text-decoration: none;
            color: #212121;
            transition: background-color 0.2s;
        }
        .menu-item:not(:last-child) {
            border-bottom: 1px solid #f8fafc;
        }
        .menu-item:hover {
            background-color: #f8fafc;
        }
        /* Square icon placeholders */
        .item-icon {
            width: 38px;
            height: 38px;
            background-color: #212121;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            margin-right: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .item-title {
            font-size: 15px;
            font-weight: 600;
            flex-grow: 1;
        }
        .item-arrow {
            color: #cccccc;
            font-size: 16px;
            font-weight: bold;
        }
        /* Fixed Bottom Tab Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #ffffff;
            border-top: 1px solid #eeeeee;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none;
            color: #888888;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item span {
            font-size: 18px;
            margin-bottom: 3px;
        }
        .nav-active {
            color: #212121;
        }
    </style>
</head>
<body>

<!-- Top Earnings Display -->
<div class="summary-card">
    <div class="summary-box">
        <div class="summary-lbl">TOTAL INCOME</div>
        <div class="summary-val">GHS {{ "%.2f"|format(total_income) }}</div>
    </div>
    <div class="summary-box">
        <div class="summary-lbl">WITHDRAWN</div>
        <div class="summary-val">GHS {{ "%.2f"|format(total_withdrawn) }}</div>
    </div>
</div>

<div class="group-lbl">TIDE OPERATIONS</div>
<div class="menu-list">
    <a href="#" class="menu-item">
        <div class="item-icon">📅</div>
        <div class="item-title">Daily Check-in</div>
        <div class="item-arrow">›</div>
    </a>
    <!-- User Plan Page Button Connection -->
    <a href="{{ url_for('my_plans') }}" class="menu-item">
        <div class="item-icon">📊</div>
        <div class="item-title">My Power Plans</div>
        <div class="item-arrow">›</div>
    </a>
    <!-- History Log Connection -->
    <a href="{{ url_for('history') }}" class="menu-item">
        <div class="item-icon">📜</div>
        <div class="item-title">History</div>
        <div class="item-arrow">›</div>
    </a>
    <!-- Deposit Page Button Connection -->
    <a href="{{ url_for('deposit') }}" class="menu-item">
        <div class="item-icon">💰</div>
        <div class="item-title">Add Funds</div>
        <div class="item-arrow">›</div>
    </a>
    <!-- Withdraw Page Button Connection -->
    <a href="{{ url_for('withdraw') }}" class="menu-item">
        <div class="item-icon">🏧</div>
        <div class="item-title">Withdraw Profits</div>
        <div class="item-arrow">›</div>
    </a>
</div>

<div class="group-lbl">ACCOUNT SECURITY</div>
<div class="menu-list">
    <a href="#" class="menu-item">
        <div class="item-icon">🏦</div>
        <div class="item-title">Bank Settings</div>
        <div class="item-arrow">›</div>
    </a>
    <a href="#" class="menu-item">
        <div class="item-icon">🔒</div>
        <div class="item-title">Change Password</div>
        <div class="item-arrow">›</div>
    </a>
</div>

<!-- Bottom Navigation Layout matching screenshot buttons -->
<div class="nav-bar">
    <a href="{{ url_for('dashboard') }}" class="nav-item">
        <span>🏠</span>HOME
    </a>
    <a href="{{ url_for('invite') }}" class="nav-item">
        <span>🔗</span>INVITE
    </a>
    <a href="{{ url_for('profile') }}" class="nav-item nav-active">
        <span>👤</span>PROFILE
    </a>
</div>

</body>
</html>
