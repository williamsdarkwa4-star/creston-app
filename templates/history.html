<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLA | HISTORY</title>
    <style>
        body { background-color: #f4f6f9; color: #212121; font-family: sans-serif; margin: 0; padding: 15px; }
        .nav-header { display: flex; align-items: center; padding: 10px 5px; margin-bottom: 20px; font-weight: bold; font-size: 18px; }
        .back-btn { font-size: 24px; margin-right: 15px; text-decoration: none; color: #212121; }
        .item { background-color: #ffffff; border-radius: 18px; padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .type { font-size: 14px; font-weight: bold; margin-bottom: 3px; }
        .meta { font-size: 12px; color: #8a8a8a; }
        .date { font-size: 11px; color: #b5b5b5; margin-top: 5px; }
        .right { text-align: right; }
        .amount { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .status { font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .Pending { color: #f59e0b; }
        .Approved { color: #10b981; }
        .Rejected { color: #ef4444; }
        .empty { text-align: center; color: #8a8a8a; padding: 50px 20px; }
    </style>
</head>
<body>

<div class="nav-header">
    <a href="{{ url_for('profile') }}" class="back-btn">‹</a>
    TRANSACTION LOG HISTORY
</div>

{% if not logs %}
<div class="empty">No historical records found for this account.</div>
{% endif %}

{% for log in logs %}
<div class="item">
    <div>
        <div class="type">{{ log.type }}</div>
        <div class="meta">{{ log.meta }}</div>
        <div class="date">{{ log.date }}</div>
    </div>
    <div class="right">
        <div class="amount">{{ log.amount }}</div>
        <div class="status {{ log.status }}">{{ log.status }}</div>
    </div>
</div>
{% endfor %}

</body>
</html>
