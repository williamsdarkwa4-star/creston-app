<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creston - Audit Statement Ledger</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,sans-serif; }
        body { background-color:#f7f9fc; padding:20px; color:#111111; }
        .hdr { display:flex; align-items:center; gap:12px; margin-bottom:24px; font-weight:bold; font-size:1.2rem; }
        .log-row { background:#ffffff; border-radius:16px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; border:1px solid #edf2f7; }
    </style>
</head>
<body>
    <div class="hdr"><a href="/profile" style="text-decoration:none; color:black;">‹</a> Transaction History Statement</div>

    {% if logs %}
        {% for log in logs %}
        <div class="log-row">
            <div>
                <div style="font-weight:bold; font-size:0.95rem; text-transform:uppercase;">{{ log.type }}</div>
                <div style="font-size:0.75rem; color:#a0aec0; margin-top:2px;">{{ log.timestamp }}</div>
            </div>
            <div style="text-align:right;">
                <div style="font-weight:800; font-size:1.05rem;">GHS {{ log.amount }}</div>
                <div style="font-size:0.75rem; font-weight:bold; margin-top:2px; color:{% if log.status=='approved' %}#34d399{% elif log.status=='pending' %}#fbbf24{% else %}#ef4444{% endif %};">{{ log.status|upper }}</div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div style="text-align:center; color:#a0aec0; margin-top:50px;">No recorded transactions found.</div>
    {% endif %}
</body>
</html>
