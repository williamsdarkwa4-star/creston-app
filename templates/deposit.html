{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center" style="font-family: system-ui, -apple-system, sans-serif;">
    <div class="col-md-5">
        <div class="card p-4 border-0 shadow-sm" style="background-color: #FFFFFF; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03) !important;">
            <h4 class="fw-bold mb-2" style="color: #0F172A;">Fund Your Account</h4>
            <p class="text-muted small mb-4">Add capital to your Creston wallet to begin generating yields.</p>
            
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted text-uppercase">Amount to Deposit (USD)</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background-color: #F8FAFC; color: #0F172A; font-weight: bold; font-size: 18px;">$</span>
                        <input type="number" step="0.01" name="amount" class="form-control form-control-lg border-0 bg-light" placeholder="0.00" style="background-color: #F8FAFC !important; font-size: 20px; font-weight: bold; color: #0F172A;" required>
                    </div>
                </div>
                
                <div class="p-3 mb-4" style="background-color: #F8FAFC; border-radius: 10px; border: 1px solid #E2E8F0;">
                    <span class="d-block small text-muted fw-semibold mb-1">Instant Processing Mode</span>
                    <span class="small d-block text-secondary">Funds will reflect on your main dashboard balance immediately.</span>
                </div>
                
                <button type="submit" class="btn btn-lg w-100 fw-bold text-white shadow-sm" style="background-color: #10B981; border: none; border-radius: 12px; font-size: 16px;">
                    Confirm Deposit Balance
                </button>
            </form>
            <a href="/dashboard" class="d-block text-center mt-3 small text-decoration-none fw-semibold text-muted">← Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
