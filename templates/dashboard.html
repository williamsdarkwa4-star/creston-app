<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creston Hub</title>
    <style>
        /* Modern UI/UX Architecture Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9; /* Clean light ambient backdrop */
            color: #1e293b;
            padding-bottom: 100px; /* Clear space for the bottom menu */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Premium Dark Header Panel */
        .top-navbar {
            background-color: #0f172a; /* Rich professional dark navy/slate */
            padding: 24px 20px 65px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
        }

        .brand-meta {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Bright Logo Accent Ring */
        .mini-logo {
            width: 46px;
            height: 46px;
            background-color: #ccff00; /* Vibrant lime-yellow signature accent */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #1e293b;
            box-shadow: 0 0 0 2px #ccff00;
        }

        .mini-logo-inner {
            width: 12px;
            height: 12px;
            background-color: #0f172a;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }

        .brand-text-wrapper {
            display: flex;
            flex-direction: column;
        }

        .brand-heading {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .brand-sub-tagline {
            font-size: 0.65rem;
            color: #94a3b8;
            letter-spacing: 0.8px;
            font-weight: 700;
            margin-top: 1px;
        }

        .user-avatar-placeholder {
            width: 42px;
            height: 42px;
            background-color: #334155;
            border-radius: 50%;
            border: 2px solid #475569;
        }

        /* Overlapping Account Balance Module Card */
        .wallet-card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 24px;
            margin: -45px 16px 30px 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            z-index: 5;
            position: relative;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .wallet-grids {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 22px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 16px;
        }

        .wallet-node {
            display: flex;
            flex-direction: column;
        }

        .wallet-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .wallet-amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
        }

        /* Wallet Action Links Control Matrix */
        .wallet-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .action-button {
            text-align: center;
            padding: 15px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .action-button.filled {
            background-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
        }

        .action-button.filled:active {
            background-color: #1e293b;
        }

        .action-button.outlined {
            border: 2px solid #e2e8f0;
            color: #0f172a;
            background-color: #ffffff;
        }

        .action-button.outlined:active {
            background-color: #f8fafc;
        }

        /* Section Investment Plans Label Header Alignment */
        .section-container {
            padding: 0 20px;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 22px;
            background-color: #0f172a;
            border-radius: 10px;
        }

        /* STRICT RULE FIX: Forces every single card to block stack one-under-the-other */
        .plans-wrapper-stack {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Uniform clean vertical gap spacing */
            padding: 0 16px;
            width: 100%;
        }

        /* Institutional Level Plan Card Designs */
        .plan-card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            width: 100%; /* Spans full screen width cleanly */
            display: flex;
            flex-direction: column;
        }

        .plan-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .plan-icon-box {
            width: 58px;
            height: 58px;
            background-color: #f1f5f9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 1px solid #e2e8f0;
        }

        .plan-info-title {
            display: flex;
            flex-direction: column;
        }

        .plan-name {
            font-size: 1.15rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .plan-cost {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
        }

        /* Uniform Metrics Row */
        .plan-metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .metric-box {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid #f1f5f9;
        }

        .metric-label {
            font-size: 0.68rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .metric-value {
            font-size: 0.9rem;
            font-weight: 800;
            color: #334155;
        }

        /* High-End Wide Active Invest Button Component Trigger */
        .invest-now-btn {
            background-color: #0f172a; /* Elegant solid dark navy fill */
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            transition: all 0.2s ease;
        }

        .invest-now-btn:active {
            background-color: #ccff00;
            color: #0f172a;
        }

        /* Fixed Mobile Tab Navigation Ribbon UI Container */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #ffffff;
            height: 72px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid #e2e8f0;
            z-index: 100;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.04);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-item.active {
            color: #0f172a; /* Dark active text alignment marker */
        }

        .nav-icon {
            font-size: 1.3rem;
        }
        
        .alert-banner-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 14px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 0 16px 20px 16px;
            border-radius: 16px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <!-- Main Branding Header Panel -->
    <div class="top-navbar">
        <div class="brand-meta">
            <div class="mini-logo">
                <div class="mini-logo-inner"></div>
            </div>
