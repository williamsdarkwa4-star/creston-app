<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creston Investment</title>
    <style>
        /* Exact layout settings matched to your phone screenshot */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
        }

        /* Top Dark Navigation Bar matching image tracking */
        .top-navbar {
            background-color: #0a1128; /* Dark navy background */
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }

        /* Red visual chevron icon + logo treatment */
        .brand-identifier {
            color: #e63946; /* Accent color matching indicator */
            font-weight: bold;
            font-size: 1.05rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        
        .brand-identifier span {
            color: #4f46e5; /* Deep purple text brand styling */
            letter-spacing: 0.5px;
        }

        /* Nav links replicating your exact inline sizing buttons */
        .nav-client-login {
            color: #4f46e5;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .nav-btn-account {
            color: #2dd4bf; /* Teal color matches border box selection */
            border: 2px solid #2dd4bf;
            padding: 3px 8px;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
        }

        /* Main core text frame section block */
        .hero-viewport {
            padding: 28px 16px;
            max-width: 100%;
        }

        /* Bold serif header */
        .headline-text {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            font-size: 2.25rem;
            font-weight: bold;
            color: #0f172a;
            line-height: 1.15;
            margin-bottom: 22px;
        }

        /* Body copy framework description style */
        .manifesto-copy {
            font-size: 1.1rem;
            color: #334155;
            line-height: 1.4;
            margin-bottom: 26px;
        }

        /* Action layout buttons container mapping */
        .action-flexbox {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cta-get-started {
            background-color: #2dd4bf;
            color: #ffffff;
            padding: 6px 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 2px;
            display: inline-block;
        }

        .cta-access-portal {
            color: #7e22ce; /* Purple accent matching screenshot text link link */
            text-decoration: underline;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Top dark navbar element section -->
    <div class="top-navbar">
        <a href="#" class="brand-identifier">📈 <span>CRESTON</span></a>
        <a href="#" class="nav-client-login">Client Login</a>
        <a href="#" class="nav-btn-account">Open Account</a>
    </div>

    <!-- Screen Content Display Frame -->
    <div class="hero-viewport">
        <h1 class="headline-text">Institutional Capital Growth</h1>
        
        <p class="manifesto-copy">
            Secure wealth compounding engine powered by automated smart ledgers.
        </p>

        <div class="action-flexbox">
            <a href="#" class="cta-get-started">Get Started</a>
            <a href="#" class="cta-access-portal">Access Portal</a>
        </div>
    </div>

</body>
</html>
