<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLA - Login</title>
    <style>
        body {
            background-color: #212121;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        .top-section {
            padding-top: 40px;
            padding-bottom: 30px;
        }
        .logo-container {
            width: 120px;
            height: 120px;
            background-color: #212121;
            border-radius: 35px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .logo-outer-circle {
            width: 90px;
            height: 90px;
            background-color: #c4df10;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-inner-circle {
            width: 50px;
            height: 50px;
            background-color: #212121;
            border-radius: 50%;
            border: 8px solid #000000;
        }
        .brand-title {
            font-size: 32px;
            font-weight: 800;
            font-style: italic;
            letter-spacing: 1px;
            margin: 0 0 8px 0;
        }
        .brand-subtitle {
            color: #8a8a8a;
            font-size: 14px;
            margin: 0;
            letter-spacing: 0.5px;
        }
        .form-card {
            background-color: #ffffff;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            padding: 50px 30px 40px 30px;
            flex-grow: 1;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .flash-messages {
            color: #ff3333;
            font-size: 14px;
            margin-bottom: 20px;
            list-style: none;
            padding: 0;
            text-align: center;
        }
        .input-box {
            background-color: #eef3fc;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            padding: 6px 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }
        .input-box .prefix {
            color: #000000;
            font-weight: 600;
            font-size: 16px;
            margin-right: 15px;
        }
        .input-box input {
            border: none;
            background: transparent;
            width: 100%;
            padding: 14px 0;
            font-size: 16px;
            color: #000000;
            outline: none;
            font-weight: 500;
        }
        .input-box .icon-left {
            margin-right: 15px;
            display: flex;
            align-items: center;
        }
        .input-box .icon-toggle {
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            opacity: 0.4;
        }
        .btn-login {
            background: linear-gradient(180deg, #3a3a3a 0%, #212121 100%);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn-login span {
            margin-right: 8px;
        }
        .footer-text {
            margin-top: auto;
            padding-top: 40px;
            font-size: 14px;
            color: #8a8a8a;
        }
        .footer-text a {
            color: #212121;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-section">
        <div class="logo-container">
            <div class="logo-outer-circle">
                <div class="logo-inner-circle"></div>
            </div>
        </div>
        <div class="brand-title">OLA</div>
        <p class="brand-subtitle">Secure Login Access</p>
    </div>

    <div class="form-card">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flash-messages">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="input-box">
                <span class="prefix">+233</span>
                <input type="tel" name="phone_number" placeholder="Phone Number" required>
            </div>
            
            <div class="input-box">
                <span class="icon-left">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </span>
                <input type="password" id="password" name="password" placeholder="••••••" required>
                <span class="icon-toggle" onclick="togglePasswordVisibility()">
                    <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
            </div>

            <button type="submit" class="btn-login">
                <span>LOGIN</span> ⚡
            </button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="{{ url_for('register') }}">Register Now</a>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            // Changes SVG to normal open eye layout [3]
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        } else {
            passwordInput.type = 'password';
            // Changes SVG back to slashed hidden eye layout [3]
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
    }
</script>

</body>
</html>
