{% extends "base.html" %}
{% block content %}
<h2>Sign in</h2>
<form method="post" class="card">
  {{ form.hidden_tag() }}
  <label>{{ form.username.label }} {{ form.username() }}</label>
  <label>{{ form.password.label }} {{ form.password() }}</label>
  <div class="row">
    {{ form.submit(class_="btn") }}
    <a class="btn ghost" href="{{ url_for('register') }}">Register</a>
  </div>
</form>
{% endblock %}
