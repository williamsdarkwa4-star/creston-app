<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creston Node Panel</title>
    <style>
        body { background-color: #0c0d12; color: #e2e8f0; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-box { background-color: #171923; padding: 40px; border-radius: 20px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #2d3142; }
        h2 { font-size: 16px; color: #ef4444; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #2d3142; background-color: #0f111a; color: white; text-align: center; font-size: 15px; margin-bottom: 20px; box-sizing: border-box; outline: none; }
        button { background-color: #ef4444; color: white; font-weight: bold; width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; letter-spacing: 0.5px; }
        .error { color: #ef4444; font-size: 13px; margin-bottom: 15px; list-style: none; padding: 0; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Secure Management Entry</h2>
    {% with msgs = get_flashed_messages() %}
        {% if msgs %}{% for m in msgs %}<div class="error">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form action="{{ url_for('admin_login') }}" method="POST">
        <input type="password" name="admin_secret" placeholder="Enter System Master Token" required>
        <button type="submit">UNLOCK ADMIN ACCESS</button>
    </form>
</div>
</body>
</html>
