{% extends "base.html" %}
{% block content %}
<h2>Create account</h2>
<form method="post" class="card">
  {{ form.hidden_tag() }}
  <label>{{ form.username.label }} {{ form.username(size=24) }}</label>
  <label>{{ form.phone.label }} {{ form.phone(size=24) }}</label>
  <label>{{ form.password.label }} {{ form.password(size=24) }}</label>
  <label>{{ form.referral.label }} {{ form.referral(size=24) }}</label>
  <div class="row">
    {{ form.submit(class_="btn") }}
    <a class="btn ghost" href="{{ url_for('login') }}">Sign in</a>
  </div>
</form>
{% endblock %}
