<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creston - Register</title>
    <style>
        body {
            background-color: #212121;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo-area {
            margin-bottom: 30px;
        }
        .logo-circle {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #e1ff00 30%, #000000 70%);
            border: 4px solid #e1ff00;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(225, 255, 0, 0.4);
        }
        .logo-inner {
            width: 30px;
            height: 30px;
            background-color: #000;
            border-radius: 50%;
            border: 5px solid #e1ff00;
        }
        .brand-name {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 13px;
            margin: 0;
        }
        .form-card {
            background-color: #ffffff;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            padding: 40px 25px 25px 25px;
            margin-top: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .input-group {
            background-color: #f1f3f5;
            border-radius: 15px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
        }
        .input-group span {
            color: #666;
            font-weight: bold;
            margin-right: 10px;
            font-size: 14px;
        }
        .input-group input {
            border: none;
            background: transparent;
            width: 100%;
            padding: 12px 5px;
            font-size: 15px;
            color: #333333;
            outline: none;
        }
        .btn-register {
            background-color: #2b2b2b;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-register:hover {
            background-color: #151515;
        }
        .login-link-container {
            margin-top: 25px;
            font-size: 14px;
            color: #888888;
        }
        .login-link-container a {
            color: #2b2b2b;
            text-decoration: none;
            font-weight: bold;
        }
        .flash-messages {
            color: #ff4d4d;
            font-size: 13px;
            margin-bottom: 15px;
            list-style: none;
            padding: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area">
        <div class="logo-circle"><div class="logo-inner"></div></div>
        <div class="brand-name">CRESTON</div>
        <p class="subtitle">Create your account to start your journey with Creston.</p>
    </div>

    <div class="form-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-messages">
            {% for category, message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="input-group">
                <span>👤</span>
                <input type="text" name="nickname" placeholder="Nickname" required>
            </div>
            
            <div class="input-group">
                <span>+233</span>
                <input type="tel" name="phone_number" placeholder="Phone Number" required>
            </div>
            
            <div class="input-group">
                <span>🔒</span>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            
            <div class="input-group">
                <span>🔗</span>
                <input type="text" name="invite_code" placeholder="Invitation Code (Optional)">
            </div>

            <button type="submit" class="btn-register">REGISTER ➔</button>
        </form>

        <div class="login-link-container">
            Have an account? <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</div>

</body>
</html>
