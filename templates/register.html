<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>JOMA - Create Account</title>

    <style>

        :root {
            --orange: #ff6f2d;
            --blue: #2339b3;
            --blue-dark: #1a2a8c;

            --input-bg: rgba(255,255,255,.92);

            --text-dark: #252936;
            --text-muted: #7c879d;

            --white: #ffffff;
            --danger: #dc3545;
            --success: #20a464;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            margin: 0;

            display: flex;
            justify-content: center;

            background: #e5e7eb;

            color: var(--text-dark);
        }


        /* =========================================
           MAIN MOBILE SCREEN
        ========================================= */

        .register-screen {

            width: 100%;
            max-width: 420px;

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.42),
                    rgba(255,255,255,.42)
                ),
                url("/static/Screenshot_20260830_134225_Chrome.jpg");

            background-size: cover;

            background-position: center;

            padding-bottom: 35px;
        }


        /* =========================================
           LIGHT PAGE OVERLAY
        ========================================= */

        .page-overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.15),
                    rgba(255,111,45,.18)
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero-banner {

            height: 245px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            z-index: 2;
        }


        /* =========================================
           LANGUAGE
        ========================================= */

        .language-dropdown {

            position: absolute;

            top: 20px;
            right: 16px;

            padding: 9px 17px;

            border-radius: 22px;

            background:
                rgba(255,255,255,.92);

            color: var(--blue);

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,.12);

            z-index: 5;
        }


        /* =========================================
           JOMA LOGO
        ========================================= */

        .center-logo-badge {

            width: 96px;
            height: 96px;

            position: absolute;

            bottom: 18px;

            border-radius: 50%;

            background: white;

            border: 4px solid
                rgba(255,255,255,.95);

            overflow: hidden;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.18);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            z-index: 5;
        }

        .logo-top {

            width: 100%;
            height: 35%;

            background:
                var(--orange);
        }

        .logo-name {

            width: 100%;

            padding: 3px 0;

            background: white;

            color: var(--blue);

            text-align: center;

            font-size: 16px;

            font-weight: 900;

            letter-spacing: 1px;
        }

        .logo-bottom {

            width: 100%;
            height: 35%;

            background:
                var(--blue);
        }


        /* =========================================
           FORM
        ========================================= */

        .form-container {

            position: relative;

            z-index: 3;

            padding: 0 24px;

            display: flex;

            flex-direction: column;
        }


        /* =========================================
           HEADING
        ========================================= */

        .form-heading {

            color: white;

            font-size: 25px;

            font-weight: 750;

            margin-bottom: 23px;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.22);
        }


        /* =========================================
           FLASH MESSAGES
        ========================================= */

        .flash-container {

            margin-bottom: 15px;
        }

        .flash-message {

            padding: 12px 14px;

            margin-bottom: 8px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.95);

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 4px 12px
                rgba(0,0,0,.10);
        }

        .flash-message.error {

            color: var(--danger);

            border-left:
                4px solid var(--danger);
        }

        .flash-message.success {

            color: var(--success);

            border-left:
                4px solid var(--success);
        }


        /* =========================================
           INPUT WRAPPER
        ========================================= */

        .input-wrapper {

            width: 100%;

            height: 55px;

            display: flex;

            align-items: center;

            background:
                var(--input-bg);

            border:
                1px solid
                rgba(255,255,255,.55);

            border-radius: 14px;

            padding: 0 16px;

            margin-bottom: 15px;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,.08);

            backdrop-filter:
                blur(5px);
        }


        /* =========================================
           INPUT
        ========================================= */

        .input-wrapper input {

            width: 100%;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            color:
                var(--text-dark);

            font-size: 15px;
        }

        .input-wrapper input::placeholder {

            color:
                var(--text-muted);
        }


        /* =========================================
           COUNTRY CODE
        ========================================= */

        .country-code-prefix {

            color:
                var(--blue);

            font-weight: 700;

            padding-right: 13px;

            margin-right: 13px;

            border-right:
                1px solid
                #c5ccd7;

            white-space: nowrap;
        }


        /* =========================================
           ICONS
        ========================================= */

        .field-icon,
        .referral-icon {

            width: 20px;

            height: 20px;

            fill:
                var(--text-muted);

            flex-shrink: 0;
        }

        .field-icon {

            cursor: pointer;

            margin-left: 8px;

            opacity: .55;

            transition:
                opacity .2s ease;
        }

        .referral-icon {

            margin-right: 12px;
        }


        /* =========================================
           REGISTER BUTTON
        ========================================= */

        .submit-button {

            width: 100%;

            height: 52px;

            margin-top: 10px;

            margin-bottom: 23px;

            border: none;

            border-radius: 27px;

            background:
                var(--blue);

            color: white;

            font-size: 16px;

            font-weight: 750;

            letter-spacing: 1px;

            text-transform: uppercase;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(35,57,179,.32);

            transition:
                .2s ease;
        }

        .submit-button:hover {

            background:
                var(--blue-dark);
        }

        .submit-button:active {

            transform:
                scale(.98);
        }


        /* =========================================
           LOGIN LINK
        ========================================= */

        .footer-redirect-link {

            color: white;

            text-align: center;

            font-size: 15px;

            font-weight: 600;

            text-decoration: none;

            text-shadow:
                0 2px 7px
                rgba(0,0,0,.25);
        }

        .footer-redirect-link:hover {

            text-decoration:
                underline;
        }


        /* =========================================
           LOADING
        ========================================= */

        .loader {

            width: 19px;

            height: 19px;

            border:
                3px solid
                rgba(255,255,255,.35);

            border-top-color:
                white;

            border-radius: 50%;

            animation:
                spin .75s linear infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =========================================
           SMALL SCREENS
        ========================================= */

        @media (max-width: 360px) {

            .form-container {

                padding-left: 18px;
                padding-right: 18px;
            }

            .hero-banner {

                height: 225px;
            }

            .center-logo-badge {

                width: 88px;
                height: 88px;
            }

            .form-heading {

                font-size: 23px;
            }
        }

    </style>
</head>


<body>

<div class="register-screen">

    <div class="page-overlay"></div>


    <!-- =========================================
         HERO
    ========================================== -->

    <section class="hero-banner">

        <div class="language-dropdown">
            Language
        </div>


        <div class="center-logo-badge">

            <div class="logo-top"></div>

            <div class="logo-name">
                JOMA
            </div>

            <div class="logo-bottom"></div>

        </div>

    </section>


    <!-- =========================================
         REGISTRATION FORM
    ========================================== -->

    <main class="form-container">

        <h1 class="form-heading">
            Create Account
        </h1>


        <!-- =====================================
             FLASK FLASH MESSAGES
        ====================================== -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                <div class="flash-container">

                    {% for category, message in messages %}

                        <div class="flash-message {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        <!-- =====================================
             REAL FLASK FORM
        ====================================== -->

        <form
            method="POST"
            action="{{ url_for('register') }}"
            id="registerForm"
        >


            <!-- =================================
                 PHONE
            ================================== -->

            <div class="input-wrapper">

                <span class="country-code-prefix">
                    +233
                </span>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- =================================
                 PASSWORD
            ================================== -->

            <div class="input-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Please new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <svg
                    class="field-icon"
                    onclick="togglePassword('password', this)"
                    viewBox="0 0 24 24"
                    aria-label="Show password"
                >

                    <path
                        d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"
                    />

                </svg>

            </div>


            <!-- =================================
                 CONFIRM PASSWORD
            ================================== -->

            <div class="input-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Please new password again"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <svg
                    class="field-icon"
                    onclick="togglePassword('confirmPassword', this)"
                    viewBox="0 0 24 24"
                    aria-label="Show password"
                >

                    <path
                        d="M12 5C7 5 2.73 8.11 1 12c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"
                    />

                </svg>

            </div>


            <!-- =================================
                 REFERRAL CODE
            ================================== -->

            <div class="input-wrapper">

                <svg
                    class="referral-icon"
                    viewBox="0 0 24 24"
                >

                    <path
                        d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                    />

                </svg>


                <input
                    type="text"
                    id="referral_code"
                    name="referral_code"
                    value="{{ referral_code or '' }}"
                    placeholder="Referral code"
                    autocomplete="off"
                >

            </div>


            <!-- =================================
                 REGISTER
            ================================== -->

            <button
                type="submit"
                id="registerButton"
                class="submit-button"
            >

                <span id="buttonText">
                    Register
                </span>

            </button>

        </form>


        <!-- =====================================
             LOGIN
        ====================================== -->

        <a
            href="{{ url_for('login') }}"
            class="footer-redirect-link"
        >
            I already have an account
        </a>

    </main>

</div>


<script>

    /* =========================================
       PASSWORD VISIBILITY
    ========================================= */

    function togglePassword(inputId, icon) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";

            icon.style.opacity = "1";

        } else {

            input.type = "password";

            icon.style.opacity = ".55";
        }
    }


    /* =========================================
       REAL FORM SUBMISSION LOADING STATE
    ========================================= */

    const form =
        document.getElementById("registerForm");

    const button =
        document.getElementById("registerButton");

    const buttonText =
        document.getElementById("buttonText");


    form.addEventListener("submit", function(event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* Browser-side validation */

        if (password !== confirmPassword) {

            event.preventDefault();

            alert("Passwords do not match.");

            return;
        }


        /* Let Flask receive the form */

        button.disabled = true;

        buttonText.innerHTML = `
            <span class="loader"></span>
            Creating...
        `;

    });

</script>

</body>
</html>
