<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOMA - Create Account</title>

  <style>
    :root {
      --brand-orange: #ff6f2d;
      --input-bg: #edf2f9;
      --text-dark: #2d3142;
      --text-muted: #7c879d;
      --btn-blue: #2339b3;
      --btn-blue-dark: #1a2a8c;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Main mobile screen */
    .register-screen {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: var(--brand-orange);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      padding-bottom: 30px;
    }

    /* Hero section */
    .hero-banner {
      width: 100%;
      height: 250px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      background:
        linear-gradient(
          180deg,
          rgba(255, 111, 45, 0) 50%,
          rgba(255, 111, 45, 1) 100%
        );
    }

    /* Decorative background */
    .hero-bg-simulation {
      position: absolute;
      inset: 0;
      display: flex;
      opacity: 0.65;
      z-index: 1;
    }

    .hero-panel {
      flex: 1;
      height: 100%;
      background-size: cover;
      background-position: center;
    }

    .hero-panel:nth-child(1) {
      background:
        linear-gradient(135deg, #a90000, #e53935);
    }

    .hero-panel:nth-child(2) {
      background:
        linear-gradient(135deg, #005c2a, #159447);
    }

    .hero-panel:nth-child(3) {
      background:
        linear-gradient(135deg, #b86600, #f5a623);
    }

    /* Language button */
    .language-dropdown {
      position: absolute;
      top: 20px;
      right: 16px;
      z-index: 10;

      background: var(--white);
      color: var(--btn-blue);

      padding: 8px 18px;
      border-radius: 20px;

      font-size: 14px;
      font-weight: 600;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      cursor: pointer;
    }

    /* JOMA logo */
    .center-logo-badge {
      position: absolute;
      bottom: 20px;
      z-index: 5;

      width: 88px;
      height: 88px;

      border-radius: 50%;
      background: #ffffff;

      border: 3px solid #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .logo-top-curve {
      width: 100%;
      height: 35%;
      background: #ff6f2d;
    }

    .logo-text-strip {
      width: 100%;
      background: #ffffff;
      color: #2339b3;

      font-size: 15px;
      font-weight: 900;
      text-align: center;

      padding: 2px 0;
      letter-spacing: 1px;
    }

    .logo-bottom-curve {
      width: 100%;
      height: 35%;
      background: #2339b3;
    }

    /* Form */
    .form-container {
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 5;
    }

    .form-heading {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    /* Input fields */
    .input-wrapper {
      width: 100%;
      height: 54px;

      background: var(--input-bg);
      border-radius: 12px;

      display: flex;
      align-items: center;

      padding: 0 16px;
      margin-bottom: 16px;

      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.05);

      transition: 0.2s ease;
    }

    .input-wrapper:focus-within {
      box-shadow:
        0 0 0 2px rgba(35, 57, 179, 0.2);
    }

    .input-wrapper input {
      width: 100%;
      height: 100%;

      border: none;
      outline: none;
      background: transparent;

      color: var(--text-dark);
      font-size: 15px;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    /* Country code */
    .country-code-prefix {
      color: var(--btn-blue);
      font-weight: 700;
      font-size: 16px;

      padding-right: 14px;
      margin-right: 14px;

      border-right: 1px solid #c2cbd6;
      white-space: nowrap;
    }

    /* Icons */
    .field-icon {
      width: 20px;
      height: 20px;

      fill: var(--text-muted);
      cursor: pointer;

      margin-left: 8px;
      flex-shrink: 0;
    }

    .referral-icon {
      width: 20px;
      height: 20px;

      fill: var(--text-muted);
      margin-right: 12px;

      flex-shrink: 0;
    }

    /* Register button */
    .submit-button {
      width: 100%;
      height: 50px;

      background: var(--btn-blue);
      color: #ffffff;

      border: none;
      border-radius: 25px;

      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;

      margin-top: 12px;
      margin-bottom: 24px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      box-shadow:
        0 4px 12px rgba(35, 57, 179, 0.3);

      transition: 0.2s ease;
    }

    .submit-button:hover {
      background: var(--btn-blue-dark);
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    /* Disabled/loading state */
    .submit-button.loading {
      cursor: not-allowed;
      opacity: 0.9;
    }

    /* Loading spinner */
    .loader {
      width: 19px;
      height: 19px;

      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Login link */
    .footer-redirect-link {
      color: #ffffff;
      text-align: center;

      font-size: 15px;
      font-weight: 500;

      text-decoration: none;
      opacity: 0.95;
    }

    .footer-redirect-link:hover {
      text-decoration: underline;
    }

    /* Small screens */
    @media (max-width: 360px) {
      .form-container {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero-banner {
        height: 230px;
      }

      .form-heading {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="register-screen">

    <!-- Hero -->
    <div class="hero-banner">

      <div class="hero-bg-simulation">
        <div class="hero-panel"></div>
        <div class="hero-panel"></div>
        <div class="hero-panel"></div>
      </div>

      <!-- Language -->
      <div class="language-dropdown">
        Language
      </div>

      <!-- JOMA Logo -->
      <div class="center-logo-badge">
        <div class="logo-top-curve"></div>

        <div class="logo-text-strip">
          JOMA
        </div>

        <div class="logo-bottom-curve"></div>
      </div>

    </div>

    <!-- Registration form -->
    <main class="form-container">

      <h1 class="form-heading">
        Create Account
      </h1>

      <!-- Phone -->
      <div class="input-wrapper">

        <span class="country-code-prefix">
          +233
        </span>

        <input
          type="text"
          id="phone"
          placeholder="Enter Username Number"
          aria-label="Username or Phone Number"
          autocomplete="tel"
        >

      </div>

      <!-- Password -->
      <div class="input-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Please new password"
          aria-label="Password"
          autocomplete="new-password"
        >

        <svg
          class="field-icon"
          onclick="togglePassword('password', this)"
          viewBox="0 0 24 24"
          aria-label="Show password"
        >
          <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.01-.16c0-1.66 1.34-3 3-3l-.16.01z"/>
        </svg>

      </div>

      <!-- Confirm password -->
      <div class="input-wrapper">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Please new password again"
          aria-label="Confirm Password"
          autocomplete="new-password"
        >

        <svg
          class="field-icon"
          onclick="togglePassword('confirmPassword', this)"
          viewBox="0 0 24 24"
          aria-label="Show password"
        >
          <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 1.66 1.34 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.01-.16c0-1.66-1.34-3-3-3l-.16.01z"/>
        </svg>

      </div>

      <!-- Referral -->
      <div class="input-wrapper">

        <svg
          class="referral-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>

        <input
          type="text"
          id="referral"
          value="50012a4e"
          readonly
          aria-label="Referral Code"
        >

      </div>

      <!-- Register -->
      <button
        type="button"
        id="registerButton"
        class="submit-button"
        onclick="registerAccount()"
      >
        <span id="buttonText">
          Register
        </span>
      </button>

      <!-- Login -->
      <a
        href="#"
        class="footer-redirect-link"
      >
        I already have an account
      </a>

    </main>

  </div>


  <script>

    /* Password visibility */
    function togglePassword(inputId, icon) {

      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        icon.style.opacity = "1";
      } else {
        input.type = "password";
        icon.style.opacity = "0.55";
      }

    }


    /* Register loading state */
    function registerAccount() {

      const button = document.getElementById("registerButton");
      const buttonText = document.getElementById("buttonText");

      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      /* Basic validation */
      if (!phone || !password || !confirmPassword) {
        alert("Please complete all required fields.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      /* Prevent repeated clicks */
      button.disabled = true;
      button.classList.add("loading");

      /* Show loading */
      buttonText.innerHTML = `
        <span class="loader"></span>
        Loading...
      `;

      /*
        This is where the real registration request
        can later be connected to the JOMA backend.
      */

      setTimeout(function () {

        button.disabled = false;
        button.classList.remove("loading");

        buttonText.textContent = "Register";

      }, 2000);

    }

  </script>

</body>
</html>
