<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOMA - Create Account</title>

  <style>
    :root {
      --orange: #ff6f2d;
      --blue: #2339b3;
      --blue-dark: #1a2a8c;
      --input-bg: rgba(255, 255, 255, 0.90);
      --text-dark: #252936;
      --text-muted: #7c879d;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
    }

    /* Main screen */
    .register-screen {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;

      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.42),
          rgba(255, 255, 255, 0.42)
        ),
        url("/static/Screenshot_20260830_134225_Chrome.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      padding-bottom: 35px;
    }

    /* Soft light overlay */
    .page-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 111, 45, 0.20)
        );

      pointer-events: none;
      z-index: 0;
    }

    /* Hero */
    .hero-banner {
      height: 245px;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      z-index: 2;
    }

    /* Language */
    .language-dropdown {
      position: absolute;
      top: 20px;
      right: 16px;

      background: rgba(255, 255, 255, 0.92);
      color: var(--blue);

      padding: 9px 17px;
      border-radius: 22px;

      font-size: 14px;
      font-weight: 600;

      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);

      cursor: pointer;
      z-index: 5;
    }

    /* JOMA logo */
    .center-logo-badge {
      width: 96px;
      height: 96px;

      position: absolute;
      bottom: 18px;

      border-radius: 50%;

      background: #ffffff;
      border: 4px solid rgba(255, 255, 255, 0.95);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.18);

      overflow: hidden;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      z-index: 5;
    }

    .logo-top {
      width: 100%;
      height: 35%;
      background: var(--orange);
    }

    .logo-name {
      width: 100%;

      padding: 3px 0;

      background: #ffffff;
      color: var(--blue);

      text-align: center;

      font-size: 16px;
      font-weight: 900;

      letter-spacing: 1px;
    }

    .logo-bottom {
      width: 100%;
      height: 35%;
      background: var(--blue);
    }

    /* Form */
    .form-container {
      position: relative;
      z-index: 3;

      padding: 0 24px;

      display: flex;
      flex-direction: column;
    }

    .form-heading {
      color: #ffffff;

      font-size: 25px;
      font-weight: 750;

      margin-bottom: 23px;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.22);
    }

    /* Input */
    .input-wrapper {
      width: 100%;
      height: 55px;

      display: flex;
      align-items: center;

      background: var(--input-bg);

      border: 1px solid rgba(255, 255, 255, 0.55);

      border-radius: 14px;

      padding: 0 16px;

      margin-bottom: 15px;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.08);

      backdrop-filter: blur(5px);
    }

    .input-wrapper input {
      width: 100%;
      height: 100%;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text-dark);

      font-size: 15px;
    }

    .input-wrapper input::placeholder {
      color: var(--text-muted);
    }

    /* Country */
    .country-code-prefix {
      color: var(--blue);

      font-weight: 700;

      padding-right: 13px;
      margin-right: 13px;

      border-right: 1px solid #c5ccd7;

      white-space: nowrap;
    }

    /* Icons */
    .field-icon,
    .referral-icon {
      width: 20px;
      height: 20px;

      fill: var(--text-muted);

      flex-shrink: 0;
    }

    .field-icon {
      cursor: pointer;
      margin-left: 8px;
    }

    .referral-icon {
      margin-right: 12px;
    }

    /* Register button */
    .submit-button {
      width: 100%;
      height: 52px;

      margin-top: 10px;
      margin-bottom: 23px;

      border: none;
      border-radius: 27px;

      background: var(--blue);
      color: #ffffff;

      font-size: 16px;
      font-weight: 750;

      letter-spacing: 1px;
      text-transform: uppercase;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      cursor: pointer;

      box-shadow:
        0 7px 18px rgba(35, 57, 179, 0.32);

      transition: 0.2s ease;
    }

    .submit-button:hover {
      background: var(--blue-dark);
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    .submit-button:disabled {
      opacity: 0.88;
      cursor: not-allowed;
    }

    /* Loading */
    .loader {
      width: 19px;
      height: 19px;

      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Login */
    .footer-redirect-link {
      color: #ffffff;

      text-align: center;

      font-size: 15px;
      font-weight: 600;

      text-decoration: none;

      text-shadow:
        0 2px 7px rgba(0, 0, 0, 0.25);
    }

    .footer-redirect-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 360px) {
      .form-container {
        padding-left: 18px;
        padding-right: 18px;
      }

      .hero-banner {
        height: 225px;
      }
    }
  </style>
</head>

<body>

  <div class="register-screen">

    <div class="page-overlay"></div>

    <!-- Hero -->
    <div class="hero-banner">

      <div class="language-dropdown">
        Language
      </div>

      <div class="center-logo-badge">
        <div class="logo-top"></div>
        <div class="logo-name">JOMA</div>
        <div class="logo-bottom"></div>
      </div>

    </div>

    <!-- Form -->
    <main class="form-container">

      <h1 class="form-heading">
        Create Account
      </h1>

      <!-- Phone -->
      <div class="input-wrapper">

        <span class="country-code-prefix">
          +233
        </span>

        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number"
          autocomplete="tel"
        >

      </div>

      <!-- Password -->
      <div class="input-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Please new password"
          autocomplete="new-password"
        >

        <svg
          class="field-icon"
          onclick="togglePassword('password', this)"
          viewBox="0 0 24 24"
        >
          <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27z"/>
        </svg>

      </div>

      <!-- Confirm password -->
      <div class="input-wrapper">

        <input
          type="password"
          id="confirmPassword"
          placeholder="Please new password again"
          autocomplete="new-password"
        >

        <svg
          class="field-icon"
          onclick="togglePassword('confirmPassword', this)"
          viewBox="0 0 24 24"
        >
          <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.74-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7z"/>
        </svg>

      </div>

      <!-- Referral -->
      <div class="input-wrapper">

        <svg
          class="referral-icon"
          viewBox="0 0 24 24"
        >
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>

        <input
          type="text"
          value="50012a4e"
          readonly
        >

      </div>

      <!-- Register -->
      <button
        type="button"
        id="registerButton"
        class="submit-button"
        onclick="registerAccount()"
      >
        <span id="buttonText">
          Register
        </span>
      </button>

      <a href="#" class="footer-redirect-link">
        I already have an account
      </a>

    </main>

  </div>


  <script>

    function togglePassword(inputId, icon) {

      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        icon.style.opacity = "1";
      } else {
        input.type = "password";
        icon.style.opacity = "0.55";
      }

    }


    function registerAccount() {

      const button =
        document.getElementById("registerButton");

      const buttonText =
        document.getElementById("buttonText");

      const phone =
        document.getElementById("phone").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;


      if (!phone || !password || !confirmPassword) {

        alert("Please complete all required fields.");

        return;
      }


      if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return;
      }


      button.disabled = true;

      buttonText.innerHTML = `
        <span class="loader"></span>
        Loading...
      `;


      setTimeout(() => {

        button.disabled = false;

        buttonText.textContent = "Register";

      }, 2000);

    }

  </script>

</body>
</html>
