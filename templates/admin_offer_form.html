<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit Offer' if offer else 'Create Offer' }} - JOMA Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f8;
            color: #17203a;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 18px;
        }

        .header {
            background: #1726a8;
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 18px;
        }

        .header h2 {
            margin: 0;
            font-size: 21px;
        }

        .header p {
            margin: 6px 0 0;
            opacity: .85;
            font-size: 13px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,.07);
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #dfe3ec;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #1726a8;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button,
        .cancel {
            flex: 1;
            border: 0;
            border-radius: 11px;
            padding: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #1726a8;
            color: white;
        }

        .cancel {
            background: #eef0f5;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>
            {{ 'Edit Offer' if offer else 'Create Offer' }}
        </h2>
        <p>JOMA Admin • Manage Offers</p>
    </div>

    <div class="card">

        <form method="POST">

            <label>Offer Name</label>
            <input
                type="text"
                name="name"
                placeholder="Example: JOMA Football Boot"
                value="{{ offer.name if offer else '' }}"
                required
            >

            <label>Price</label>
            <input
                type="number"
                name="price"
                step="0.01"
                min="0"
                placeholder="0.00"
                value="{{ offer.price if offer else '' }}"
                required
            >

            <label>Daily Amount</label>
            <input
                type="number"
                name="daily_amount"
                step="0.01"
                min="0"
                placeholder="0.00"
                value="{{ offer.daily_amount if offer else '' }}"
                required
            >

            <label>Duration</label>
            <input
                type="number"
                name="duration"
                min="0"
                placeholder="180"
                value="{{ offer.duration if offer else '' }}"
                required
            >

            <label>Image URL</label>
            <input
                type="text"
                name="image_url"
                placeholder="images/football-shoe.jpg"
                value="{{ offer.image_url if offer else '' }}"
            >

            <label>Description</label>
            <textarea
                name="description"
                placeholder="Enter offer description..."
            >{{ offer.description if offer else '' }}</textarea>

            <div class="buttons">
                <a href="{{ url_for('admin_offers') }}" class="cancel">
                    Cancel
                </a>

                <button type="submit">
                    {{ 'Save Changes' if offer else 'Create Offer' }}
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
