<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Directory Ledger</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,sans-serif; }
        body { background-color:#111111; color:white; padding:20px; }
        .user-row { background:#1a1a1a; padding:16px; border-radius:14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; border:1px solid #2d2d2d; }
    </style>
</head>
<body>
    <div style="margin-bottom:20px;"><a href="/admin/dashboard" style="color:#ccff00; text-decoration:none; font-weight:bold;">‹ Back Dashboard</a></div>
    <h2 style="font-weight:800; margin-bottom:20px;">System Membership Audit Directory</h2>

    {% for user in members %}
    <div class="user-row">
        <div>
            <div style="font-weight:bold; font-size:1rem;">👤 {{ user.nickname }}</div>
            <div style="color:#666; font-size:0.8rem; margin-top:2px;">+233 {{ user.phone_number }}</div>
        </div>
        <div style="text-align:right;">
            <div style="font-size:0.75rem; color:#888; text-transform:uppercase; font-weight:bold;">Liquid Ledger Net-Balance</div>
            <div style="font-weight:800; color:#34d399; font-size:1.1rem; margin-top:2px;">GHS {{ "{:,.2f}".format(user.wallet_balance) }}</div>
        </div>
    </div>
    {% endfor %}
</body>
</html>
