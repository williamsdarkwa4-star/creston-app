<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reset Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #111111; color: white; padding: 20px; }
        .form-card { background-color: #1a1a1a; border: 1px solid #2d2d2d; padding: 24px; border-radius: 18px; margin-top: 20px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 20px; }
        .input-group label { font-size: 0.8rem; font-weight: 700; color: #a0aec0; text-transform: uppercase; margin-bottom: 6px; }
        .input-control { background-color: #262626; border: 1px solid #3d3d3d; border-radius: 12px; padding: 14px; color: white; font-size: 1rem; outline: none; }
        .submit-btn { background-color: #ef4444; color: white; border: none; width: 100%; padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div><a href="/admin/dashboard" style="color:#ccff00; text-decoration:none; font-weight:bold;">‹ Back Dashboard</a></div>
    <h2 style="font-weight: 800; margin-top:20px;">Manual Security Password Reset Override</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %} <p style="color: #34d399; font-size: 0.9rem; margin-top: 15px;">🎉 {{ msg }}</p> {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="form-card">
        <form action="/admin/password_reset" method="POST">
            <div class="input-group">
                <label>Target Account Phone Number (e.g. 0220189741)</label>
                <input type="text" name="target_phone" class="input-control" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Set New Clean Password String</label>
                <input type="text" name="new_password" class="input-control" required autocomplete="off">
            </div>
            <button type="submit" class="submit-btn">Overwrite User Credentials</button>
        </form>
    </div>
</body>
</html>
