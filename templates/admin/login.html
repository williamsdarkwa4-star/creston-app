<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creston Admin - Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #111111; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background-color: #1a1a1a; border: 1px solid #2d2d2d; padding: 35px 24px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 20px; }
        .input-group label { font-size: 0.8rem; font-weight: 700; color: #a0aec0; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .input-control { background-color: #262626; border: 1px solid #3d3d3d; border-radius: 12px; padding: 14px; color: white; font-size: 1rem; outline: none; }
        .input-control:focus { border-color: #ccff00; }
        .submit-btn { background-color: #ccff00; color: #111111; border: none; width: 100%; padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="color: white; margin-bottom: 8px; font-weight: 800; font-size: 1.6rem;">CRESTON ADMIN</h2>
        <p style="color: #666; font-size: 0.85rem; margin-bottom: 30px;">Authorized Management Operations Only</p>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %} <p style="color: #ef4444; font-size: 0.85rem; margin-bottom: 15px;">⚠️ {{ msg }}</p> {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/admin/login" method="POST">
            <div class="input-group">
                <label>Admin Username</label>
                <input type="text" name="Williams" class="input-control" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>Security Keyphrase</label>
                <input type="Williams12" name="Williams12" class="input-control" required>
            </div>
            <button type="submit" class="submit-btn">Authorize Entry</button>
        </form>
    </div>
</body>
</html>
